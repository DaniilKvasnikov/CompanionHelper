<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CompanionHelper — статусы</title>
<style>
  :root {
    --fs: 15px;
    --bg: #0f1114; --card: #171b21; --line: #262d37; --text: #dde1e6;
    --dim: #8b949e; --ok: #4ec97b; --mixed: #f0b429; --bad: #ff7b72; --unknown: #5b636e;
  }
  * { box-sizing: border-box; }
  html { font-size: var(--fs); }
  body {
    margin: 0; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text);
    font: 1rem/1.3 system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header.top {
    flex: 0 0 auto; display: flex; align-items: center; gap: .7rem;
    padding: .3rem .6rem; border-bottom: 1px solid var(--line);
  }
  header.top .title { font-weight: 600; white-space: nowrap; }
  header.top .meta { color: var(--dim); font-variant-numeric: tabular-nums; flex: 1 1 auto;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header.top .meta.bad { color: var(--bad); }
  .btn {
    flex: 0 0 auto; font: inherit; color: var(--text); background: #21262d; cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px; padding: .1rem .5rem;
  }
  .btn:hover { background: #2a313a; }
  .btn .n { color: var(--bad); font-variant-numeric: tabular-nums; }
  .btn.calm .n { color: var(--dim); }

  /* Two rows of two panels instead of one long row: every panel gets real width
     and the eye does not have to travel across the whole screen. AOTO and
     PixelHue (the right column) are a little wider because they hold values. */
  main {
    flex: 1 1 auto; min-height: 0; display: grid; gap: .4rem; padding: .4rem .55rem .55rem;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr);
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
  }
  @media (max-width: 70rem) { main { grid-template-columns: 1fr 1fr; overflow: auto; } }
  @media (max-width: 46rem) {
    main { grid-template-columns: 1fr; grid-template-rows: none; overflow: auto; }
  }
  .panel {
    min-height: 0; overflow: auto; background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: .35rem .45rem .45rem;
  }
  .panel > h2 {
    margin: 0 0 .25rem; font-size: .76rem; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: var(--dim); display: flex; gap: .4rem; align-items: baseline;
  }
  .panel > h2 .sub { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .hint { color: var(--dim); }

  /* --- AOTO: one block per group, inside it one cluster per device section --- */
  .group + .group { margin-top: .3rem; border-top: 1px solid var(--line); padding-top: .3rem; }
  .ghead { display: flex; align-items: baseline; gap: .4rem; }
  /* The group name is the block's headline, so it must stay readable even when
     fit() has shrunk the whole page: max() gives it a floor in real pixels. */
  .ghead b { font-weight: 600; font-size: max(1.25rem, 15px); }
  .chip { font-size: .72rem; padding: 0 .35rem; border-radius: 4px; background: #21262d; color: var(--dim); }
  .chip.ok { color: var(--ok); } .chip.mixed { color: var(--mixed); } .chip.err { color: var(--bad); }
  .shead {
    color: var(--dim); font-size: .74em; letter-spacing: .05em; text-transform: uppercase;
    margin: .18rem 0 .08rem;
  }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.2rem, 1fr)); gap: .2rem .35rem; }
  .tile {
    display: flex; flex-direction: column; min-width: 0; padding: .05rem .3rem .1rem;
    border-left: 2px solid var(--unknown); background: rgba(255,255,255,.025); border-radius: 3px;
  }
  .tile.ok { border-left-color: var(--ok); }
  .tile.mixed, .tile.partial { border-left-color: var(--mixed); }
  .tile.error { border-left-color: var(--bad); }
  .tile .tl { color: var(--dim); font-size: .78em; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .tile .tv { font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .tile .tv .pct { color: var(--dim); }
  .tile.mixed .tv, .tile.partial .tv { color: var(--mixed); }
  .tile.error .tv { color: var(--bad); }

  /* --- PC ------------------------------------------------------------------ */
  .hosts { display: flex; flex-direction: column; gap: .05rem; }
  .host { display: flex; align-items: center; gap: .35rem; min-width: 0; }
  .host .dot, .job .dot { flex: 0 0 auto; width: .5rem; height: .5rem; border-radius: 50%;
    background: var(--unknown); }
  .host.up .dot, .job.running .dot { background: var(--ok); }
  .host.down .dot, .job.failed .dot { background: var(--bad); }
  .job.mixed .dot { background: var(--mixed); }
  .host .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; }
  .host .ip { color: var(--dim); font-variant-numeric: tabular-nums; }

  /* --- PDQ journal --------------------------------------------------------- */
  .jobs { display: flex; flex-direction: column; gap: .08rem; }
  .job {
    display: grid; grid-template-columns: .6rem minmax(0, 1fr) auto auto; gap: .35rem;
    align-items: center; cursor: help;
  }
  .job .pkg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job .st { font-size: .8em; color: var(--dim); white-space: nowrap; }
  .job.running .st { color: var(--ok); } .job.failed .st { color: var(--bad); }
  .job .n { font-size: .8em; color: var(--dim); font-variant-numeric: tabular-nums;
    white-space: nowrap; }

  /* --- PixelHue ------------------------------------------------------------ */
  .badges { display: flex; flex-wrap: wrap; gap: .2rem; margin-bottom: .2rem; }
  .badge {
    font-size: .8rem; padding: 0 .4rem; border-radius: 4px; background: #21262d;
    border: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .badge .k { color: var(--dim); margin-right: .25rem; }
  .badge.ok { background: #14291d; border-color: #24512f; } .badge.ok .k { color: #8affc1; }
  .badge.error { background: #2d1a1a; border-color: #5a2626; } .badge.error .k { color: #ff9d97; }
  .badge.mixed { background: #2c2413; border-color: #5a4a1c; }
  .scr { display: flex; align-items: baseline; gap: .3rem; min-width: 0; }
  .scr .nm { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<header class="top">
  <span class="title">CompanionHelper · статусы</span>
  <span class="meta" id="meta">загрузка…</span>
  <button class="btn calm" id="logs" title="Открыть окно с причинами: что и почему не читается">
    Логи <span class="n" id="badge">0</span>
  </button>
</header>
<main>
  <section id="pc" class="panel"></section>
  <section id="aoto" class="panel"></section>
  <section id="pdq" class="panel"></section>
  <section id="pixelhue" class="panel"></section>
</main>

<script>
"use strict";

// The browser asks every second; the server re-reads the devices on its own
// interval (shown in the header) and always answers instantly.
const POLL_MS = 1000;
const STATE_LABEL = { ok: "ок", mixed: "расхождение", partial: "частично",
                      error: "ошибка", unknown: "нет данных" };
const JOB_LABEL = { running: "идёт", ok: "ok", failed: "ошибка",
                    other: "?", unknown: "?" };

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = String(text);
  return n;
};
const ago = (s) => (s === null || s === undefined) ? "" :
  (s < 90 ? Math.round(s) + " с" : Math.round(s / 60) + " мин");
const fmt = (v) => (v === null || v === undefined) ? "—"
  : (typeof v === "boolean" ? (v ? "вкл" : "выкл") : String(v));
const shortAddr = (addr) => "." + String(addr).split(":")[0].split(".").pop();
const header = (title, note) => {
  const h = el("h2");
  h.append(el("span", null, title));
  if (note) h.append(el("span", "sub", note));
  return h;
};

// --- AOTO: grouped by the device's own sections -----------------------------
function tile(p) {
  const box = el("div", "tile " + p.state);
  const addrs = p.controllers
    .map((c) => shortAddr(c.addr) + " " + (c.ok ? fmt(c.value) : "нет ответа")).join(" · ");
  box.title = p.label + " [" + (p.section || "") + "] — " + (STATE_LABEL[p.state] || p.state) +
    (addrs ? "\n" + addrs : "") + (p.state === "error" ? "\nпричину смотрите в логах" : "");
  box.append(el("span", "tl", p.label));
  const value = el("span", "tv", fmt(p.value));
  if (p.percent) value.append(el("span", "pct", " · " + p.percent));
  box.append(value);
  return box;
}

function groupCard(g) {
  const card = el("div", "group");
  const head = el("div", "ghead");
  head.append(el("b", null, g.group));
  // The headline number is about CONTROLLERS (the deck's "OK n/n"), not about
  // parameters: a group of two controllers with one down is "1/2 ок", however
  // many values the page reads from it.
  const ctl = g.controllers;   // absent until the server is restarted: fall back below
  const bad = g.params.filter((p) => p.state === "error").length;
  const mixed = g.params.filter((p) => p.state === "mixed" || p.state === "partial").length;
  let cls, text;
  if (!ctl) {
    cls = bad ? "err" : (mixed ? "mixed" : "ok");
    text = bad === g.params.length ? "нет связи"
      : (bad || mixed ? `${bad + mixed} из ${g.params.length} не ок` : `${g.params.length} ок`);
  } else if (!ctl.total) {
    cls = "err"; text = "нет адресов";
  } else {
    cls = ctl.ok === 0 ? "err" : (ctl.ok === ctl.total && !bad && !mixed ? "ok" : "mixed");
    text = ctl.ok + "/" + ctl.total + " ок";
    // Controllers fine but a value still missing (a reply without the field): say so.
    if (ctl.ok === ctl.total && (bad || mixed)) text += ` · ${bad + mixed} парам. не ок`;
  }
  head.append(el("span", "chip " + cls, text));
  card.append(head);

  // One cluster per device section (/globalSettings, /input, /system, ...).
  const bySection = new Map();
  for (const p of g.params) {
    const key = p.section || "Прочее";
    if (!bySection.has(key)) bySection.set(key, []);
    bySection.get(key).push(p);
  }
  for (const [section, params] of bySection) {
    const block = el("div", "sect");
    block.append(el("div", "shead", section));
    const tiles = el("div", "tiles");
    for (const p of params) tiles.append(tile(p));
    block.append(tiles);
    card.append(block);
  }
  return card;
}

function renderAoto(box, groups) {
  box.replaceChildren(header("AOTO", groups.length ? groups.length + " групп" : ""));
  if (!groups.length) { box.append(el("div", "hint", "нет групп — добавьте файл в aoto/groups/")); return; }
  for (const g of groups) box.append(groupCard(g));
}

// --- PC ---------------------------------------------------------------------
function renderPc(box, pc) {
  box.replaceChildren(header("ПК", pc.active_list ? "лист: " + pc.active_list : "нет листа"));
  if (!pc.hosts.length) { box.append(el("div", "hint", "нет хостов в активном списке PDQ")); return; }
  const list = el("div", "hosts");
  for (const h of pc.hosts) {
    const cls = h.up === true ? "up" : (h.up === false ? "down" : "unknown");
    const row = el("div", "host " + cls);
    row.title = h.host + (h.alias ? " (" + h.alias + ")" : "") +
      (h.up === null || h.up === undefined ? " — не пинговался" : " — пинг " + ago(pc.checked_ago) + " назад");
    row.append(el("i", "dot"));
    row.append(el("span", "n", h.alias || h.host));
    row.append(el("span", "ip", shortAddr(h.host)));
    list.append(row);
  }
  box.append(list);
}

// --- PDQ: what ran, and how it ended ----------------------------------------
function jobRow(d) {
  const row = el("div", "job " + d.state);
  row.append(el("i", "dot"));
  row.append(el("span", "pkg", d.package));
  row.append(el("span", "st", JOB_LABEL[d.state] || d.status));
  row.append(el("span", "n", d.targets ? d.targets + " ПК" : (d.started || "")));

  const lines = [("#" + d.id + " " + d.package + " — " + d.status).trim()];
  if (d.started || d.finished) lines.push("начало " + (d.started || "?") +
    (d.finished ? ", конец " + d.finished : ""));
  if (d.target_names.length) {
    lines.push("ПК: " + d.target_names
      .map((n, i) => n + " " + (JOB_LABEL[d.target_states[i]] || "?")).join(", "));
  }
  const raw = Object.entries(d.raw || {})
    .filter(([k]) => !/^id$/i.test(k)).slice(0, 8)
    .map(([k, v]) => k + "=" + v).join(" · ");
  if (raw) lines.push(raw);
  row.title = lines.join("\n");
  return row;
}

function renderPdq(box, data) {
  const jobs = data.deployments || [];
  box.replaceChildren(header("PDQ", jobs.length ? "задачи · " + ago(data.age) : ""));
  if (!jobs.length) {
    box.append(el("div", "hint", "журнал задач не прочитан"));
    box.append(el("div", "hint", "причина — в логах (база PDQ, права, схема)"));
    return;
  }
  const list = el("div", "jobs");
  for (const d of jobs) list.append(jobRow(d));
  box.append(list);
}

// --- PixelHue ---------------------------------------------------------------
function flagOf(screens, key) {
  if (!screens.length) return null;
  const vals = screens.map((s) => s[key]);
  if (!vals.every((v) => v === vals[0])) return "mix";
  return vals[0] === 1 ? 1 : 0;
}
const flagClass = (v) => v === "mix" ? "mixed" : (v === 1 ? "ok" : "");
const flagWord = (v) => v === "mix" ? "частично" : (v === 1 ? "вкл" : "выкл");

function renderPixelHue(box, ph) {
  box.replaceChildren(header("PixelHue", ph.host));
  const badges = el("div", "badges");
  const add = (key, word, cls, title) => {
    const b = el("div", "badge " + cls);
    b.title = title || "";
    b.append(el("span", "k", key));
    b.append(el("span", null, word));
    badges.append(b);
  };
  add("узел", ph.online === 1 ? "online" : (ph.online === 0 ? "offline" : "нет данных"),
      ph.online === 1 ? "ok" : (ph.online === 0 ? "error" : ""),
      (ph.version || "") + (ph.error ? " — " + ph.error : ""));
  add("Mapping", ph.mapping === 1 ? "вкл" : (ph.mapping === 0 ? "выкл" : "…"),
      ph.mapping === 1 ? "ok" : "",
      "Mapping — переключатель PixelFlow «Device → Location → Mapping»");
  for (const [label, key, tip] of [
    ["Затемнение", "ftb", "FTB (Fade To Black) — плавное затемнение всего выхода, сразу по всем экранам"],
    ["Стоп-кадр", "freeze", "Freeze — заморозка картинки (стоп-кадр), сразу по всем экранам"],
  ]) {
    const v = flagOf(ph.screens, key);
    add(label, flagWord(v), flagClass(v), tip + "\nсейчас: " + flagWord(v) + " (по экранам)");
  }
  add("пресеты", ph.presets, "", "Сколько пресетов отдаёт устройство");
  box.append(badges);

  if (!ph.screens.length) { box.append(el("div", "hint", "экраны не прочитаны")); return; }
  for (const s of ph.screens) {
    const row = el("div", "scr");
    row.append(el("span", "nm", s.name));
    for (const [key, word, tip] of [["ftb", "FTB", "Затемнение (FTB): "],
                                    ["freeze", "FZ", "Стоп-кадр (Freeze): "]]) {
      const on = s[key] === 1;
      const chip = el("span", "badge " + (on ? "ok" : ""), word);
      chip.title = tip + (on ? "вкл" : "выкл") + " на этом экране";
      row.append(chip);
    }
    box.append(row);
  }
}

// --- fit: everything on one screen, no page scrolling -----------------------
function overflowing() {
  const main = document.querySelector("main");
  if (main.scrollHeight > main.clientHeight + 1 || main.scrollWidth > main.clientWidth + 1) return true;
  return [...document.querySelectorAll(".panel")]
    .some((p) => p.scrollHeight > p.clientHeight + 1);
}

function fit() {
  const root = document.documentElement;
  let size = 15;
  const set = (s) => root.style.setProperty("--fs", s + "px");
  set(size);
  for (let i = 0; i < 14 && size > 8.5 && overflowing(); i++) {
    size -= 0.5;
    set(size);
  }
}

// --- polling ----------------------------------------------------------------
const meta = document.getElementById("meta");
const badge = document.getElementById("badge");
const logsBtn = document.getElementById("logs");
let failures = 0;
let shown = null;

logsBtn.addEventListener("click", () => window.open("/logs", "chlogs", "width=980,height=720"));

function renderMeta(d) {
  const bits = [];
  if (failures > 0) bits.push("нет связи с сервером (" + failures + ") — показаны последние данные");
  else if (d.age === null || d.age === undefined) bits.push("данные ещё не прочитаны");
  else bits.push("обновлено " + ago(d.age) + " назад");
  if (d.stale && !failures) bits.push("данные не обновляются");
  bits.push("опрос " + d.interval + " с");
  if (d.read_at) bits.push("в " + d.read_at);
  if (d.problems) bits.push("проблем: " + d.problems + " — смотрите логи");
  meta.textContent = bits.join(" · ");
  meta.classList.toggle("bad", failures > 0 || d.stale || !!d.problems);
  badge.textContent = d.problems || 0;
  logsBtn.classList.toggle("calm", !d.problems);
}

function render(d) {
  shown = d;
  renderMeta(d);
  renderPc(document.getElementById("pc"), d.pc || { hosts: [], active_list: null, checked_ago: null });
  renderAoto(document.getElementById("aoto"), d.aoto || []);
  renderPdq(document.getElementById("pdq"), d.pdq || { deployments: [], age: null });
  renderPixelHue(document.getElementById("pixelhue"),
    d.pixelhue || { host: "", screens: [], presets: 0, mapping: null, online: null });
  fit();
}

async function tick() {
  try {
    const resp = await fetch("/status", { cache: "no-store" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    render(await resp.json());
    failures = 0;
  } catch (e) {
    failures += 1;
    renderMeta({ age: null, interval: "?", stale: true, problems: shown ? shown.problems : 0 });
  }
  setTimeout(tick, POLL_MS);
}

window.addEventListener("resize", fit);
tick();
</script>
</body>
</html>
